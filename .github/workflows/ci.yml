name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r gost-generator/requirements-dev.txt
      - name: Generate fixtures
        run: python tests/fixtures/make_fixtures.py
        working-directory: gost-generator
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        working-directory: gost-generator
      - name: CLI smoke (JSON envelope, exit codes)
        run: |
          python -m app.cli doctor --json > doctor.json
          python -c "import json;d=json.load(open('doctor.json',encoding='utf-8'));assert d['schema_version']==1 and d['ok'] is True"
          python -m app.cli check tests/fixtures/fixtures_good.docx --format json --fail-on error
        working-directory: gost-generator

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r gost-generator/requirements-dev.txt
      - name: Generate fixtures
        run: python tests/fixtures/make_fixtures.py
        working-directory: gost-generator
      - name: Run unit tests (GUI-тесты работают, Tk есть в сборке Python)
        run: python -m unittest discover -s tests -v
        working-directory: gost-generator
